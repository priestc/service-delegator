[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-delegator"
version = "0.1.0"
description = "Route AI prompts from all my projects to swappable providers, and log how each one performs"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "httpx",
    "openai",
    "anthropic",
    "google-genai",
]

[project.scripts]
ai-delegator = "ai_delegator.cli:main"

[tool.setuptools.packages.find]
include = ["ai_delegator*"]
