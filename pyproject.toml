[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "service-delegator"
version = "0.1.0"
description = "One place for all my projects' AI prompts and web API calls: swappable AI providers per task, and a log of how every service performs"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "httpx[http2]",
    "openai",
    "anthropic",
    "google-genai",
]

[project.scripts]
service-delegator = "service_delegator.cli:main"

[tool.setuptools.packages.find]
include = ["service_delegator*"]
